  .dot { fill: #3c7a56; animation: dot .35s cubic-bezier(.22,1,.36,1) both; }
  @keyframes dot { from { fill: #efefec; } }
  .in { animation: in .45s cubic-bezier(.22,1,.36,1) both; }
  @keyframes in { from { opacity: 0; transform: translateY(6px); } }
  @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
</style>
